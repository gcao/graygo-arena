[project]
name = "graygo-arena"
version = "0.1.0"
description = "Backend-owned Gray Go arena engine and orchestration."
readme = "../docs/design.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.146.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hypothesis]
derandomize = true
max_examples = 75

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
